# /etc/apache2/sites-available/000-default.conf
# DocumentRoot is set by the entrypoint: /var/www/public for Laravel
# (artisan present), otherwise /var/www. Override with APACHE_DOCUMENT_ROOT.

<VirtualHost *:${APACHE_PORT}>
    ServerName localhost
    ServerAlias *

    DocumentRoot "${APACHE_DOCUMENT_ROOT}"
    <Directory "${APACHE_DOCUMENT_ROOT}">
        Options FollowSymLinks
        # enable the .htaccess rewrites
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Never serve dotfiles/dirs (.env, .git, .env.old ...), except .well-known.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # Project files that must not be downloadable when the docroot is /var/www.
    <FilesMatch "^(artisan|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|.*\.(sql|sqlite|sqlite3|log|sh|lock|bak|env))$">
        Require all denied
    </FilesMatch>

    # APACHE_BLOCK_MULTIPART=true: reject multipart requests (breaks uploads).
    # Emergency mitigation for upload-parser bugs such as PHP2Shell.
    <IfDefine BLOCK_MULTIPART>
        <If "req('Content-Type') =~ /multipart/i">
            Require all denied
        </If>
    </IfDefine>

    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "/dev/stderr"
    CustomLog "/dev/stdout" combined
    LogLevel warn
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
