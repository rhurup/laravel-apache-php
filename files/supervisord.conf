; supervisord is PID 1 and runs everything as www-data.

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid
; Reverb needs many open sockets.
minfds=10000

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[program:php-fpm]
command=/usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --force-stderr
priority=10
autorestart=true
stopsignal=QUIT
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:apache2]
command=/usr/local/bin/apache2-foreground
priority=20
autorestart=true
stopsignal=WINCH
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Stop the container if Apache or PHP-FPM can't be kept running, so Docker's
; restart policy / the orchestrator can deal with it.
[eventlistener:exit-on-fatal]
command=/usr/local/bin/supervisor-exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /etc/supervisor/conf.d/*.conf
