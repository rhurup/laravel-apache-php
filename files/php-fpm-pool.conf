; PHP-FPM pool. The master runs as www-data, so no user/group switching here.
; Values use ${ENV:-default} (PHP >= 8.3), so they can be tuned per container.
[www]
listen = /run/php/php-fpm.sock
listen.mode = 0660

pm = ${FPM_PM:-dynamic}
pm.max_children = ${FPM_MAX_CHILDREN:-100}
pm.start_servers = ${FPM_START_SERVERS:-20}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS:-10}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS:-40}
pm.max_requests = ${FPM_MAX_REQUESTS:-500}
request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT:-0}

; Used by the container healthcheck (via cgi-fcgi, not exposed through Apache).
ping.path = /fpm-ping
pm.status_path = /fpm-status

catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT:-512M}

; Defaults allow ~2 GB uploads (e.g. video). Files are streamed to disk, so
; memory_limit doesn't need to match post_max_size. Apache's own limit is
; APACHE_LIMIT_REQUEST_BODY (default 2 GiB, Apache's maximum).
php_admin_value[upload_max_filesize] = ${PHP_UPLOAD_MAX_FILESIZE:-2048M}
php_admin_value[post_max_size] = ${PHP_POST_MAX_SIZE:-2148M}
php_admin_value[max_execution_time] = ${PHP_MAX_EXECUTION_TIME:-600}
php_admin_value[max_input_time] = ${PHP_MAX_INPUT_TIME:-600}
php_admin_value[max_file_uploads] = ${PHP_MAX_FILE_UPLOADS:-30}
