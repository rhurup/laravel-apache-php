; Loaded last for both FPM and CLI.
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = ${PHP_TIMEZONE:-Europe/Copenhagen}

session.cookie_httponly = On
session.use_strict_mode = On

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY:-256}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Set to 0 for immutable deploys (code baked into the image) for extra speed.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}

; pcov is installed for test coverage but off by default (it slows down
; production). Enable per run: php -d pcov.enabled=1 vendor/bin/phpunit --coverage-text
pcov.enabled = 0
