name: Build images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Weekly rebuild to pick up OS and PHP security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laravel-apache-php
  LATEST_PHP: "8.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          images=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images docker.io/$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/laravel-apache-php"
          fi
          tags=""
          for image in $images; do
            tags="$tags,$image:${{ matrix.php }},$image:${{ matrix.php }}-$(date -u +%Y%m%d)"
            if [ "${{ matrix.php }}" = "$LATEST_PHP" ]; then tags="$tags,$image:latest"; fi
          done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

  dockerhub-description:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync README to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/laravel-apache-php
          short-description: "Apache + PHP-FPM + Composer + Node image for Laravel. PHP 8.3 / 8.4 / 8.5, runs as non-root."
          readme-filepath: ./README.md
          enable-url-completion: true

      # rhuruphansen/laravel is the image's old name and no longer receives
      # builds; point anyone landing there to the new image.
      - name: Mark old Docker Hub repository as moved
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/laravel
          short-description: "Moved to rhuruphansen/laravel-apache-php. This image is no longer updated."
          readme-filepath: ./.github/dockerhub-moved.md
